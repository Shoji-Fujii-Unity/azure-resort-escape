<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Azure Moonlight Resort - an escape point & click adventure set in an abandoned seaside resort.">
<title>Azure Moonlight Resort — 脱出ゲーム</title>
<style>
:root{
  --gold:#e8c877; --teal:#7fd4e0; --dim:#8d97a8; --bg:#05070d;
  --panel:rgba(10,14,22,.94); --line:rgba(232,200,119,.35);
  --touch:44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:"Hiragino Kaku Gothic New","Yu Gothic UI","Segoe UI",system-ui,-apple-system,sans-serif;
  color:#dfe6ef;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 20%,#0b1120 0%,#04060b 75%)}
#game{position:relative;width:min(100vw,calc(100vh*1.7778));height:min(100vh,calc(100vw*0.5625));
  overflow:hidden;background:#080d17;box-shadow:0 0 80px rgba(0,0,0,.8),0 0 0 1px rgba(232,200,119,.08)}
#scene{position:absolute;inset:0}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(2,5,10,.16) 100%),
    linear-gradient(180deg,rgba(2,5,10,.16),transparent 18%,transparent 72%,rgba(2,5,10,.2))}
#hotspots{position:absolute;inset:0;pointer-events:none}
/* ---------- hotspots ---------- */
.hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  border-radius:14px;border:1.5px solid transparent;background:transparent;
  min-width:34px;min-height:26px;transition:background .25s,border-color .25s,box-shadow .25s}
.hs::after{content:"";position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px 2px rgba(232,200,119,.5),0 0 14px var(--gold);animation:pulse 1.8s infinite;opacity:.9}
.hs.found::after{width:6px;height:6px;background:#4f7a6a;box-shadow:none;animation:none;opacity:.5}
.hs:hover,.hs.hl{border-color:var(--gold);background:rgba(232,200,119,.14);box-shadow:0 0 18px rgba(232,200,119,.25)}
.hs:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hs.nav{border-radius:50%;width:7.5%;aspect-ratio:1/1;border-color:rgba(127,212,224,.5);
  background:radial-gradient(circle,rgba(127,212,224,.22),rgba(6,10,18,.62));box-shadow:0 4px 16px rgba(0,0,0,.25);
  backdrop-filter:blur(3px)}
.hs.nav:hover,.hs.nav.hl{border-color:var(--teal);background:radial-gradient(circle,rgba(127,212,224,.4),rgba(6,10,18,.72));
  box-shadow:0 0 22px rgba(127,212,224,.32)}
.hs.nav::after{display:none}
.hs.nav::before{content:attr(data-a);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,3.2vmin,30px);color:var(--teal)}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.25);opacity:1}}
/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;bottom:0;padding:1.2vmin 1.6vmin;background:linear-gradient(0deg,rgba(4,7,12,.97) 62%,rgba(4,7,12,.82) 86%,transparent);
  border-top:1px solid rgba(232,200,119,.12);z-index:20;backdrop-filter:blur(8px)}
#msg{min-height:5.4vmin;font-size:clamp(12px,2.05vmin,19px);line-height:1.5;color:#f0f3f8;text-shadow:0 2px 8px #000;margin-bottom:.8vmin}
#msg b{color:var(--gold)}#msg i{color:var(--teal);font-style:normal}
#invRow{display:flex;gap:1.2vmin;align-items:center;min-height:8vmin;flex-wrap:wrap;padding-top:.7vmin;border-top:1px solid rgba(255,255,255,.08)}
#inv{display:flex;gap:1vmin;flex-wrap:wrap;flex:1}
.item{width:8vmin;height:8vmin;min-width:44px;min-height:44px;max-width:64px;max-height:64px;border-radius:10px;
  border:1.5px solid rgba(210,224,244,.2);background:linear-gradient(145deg,rgba(33,47,68,.96),rgba(10,16,27,.94));
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 5px 14px rgba(0,0,0,.24);cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:4vmin;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.item:hover{border-color:rgba(232,200,119,.55);transform:translateY(-2px)}
.item.sel{border-color:var(--gold);background:linear-gradient(145deg,rgba(90,72,39,.74),rgba(24,26,30,.96));
  box-shadow:inset 0 1px rgba(255,255,255,.14),0 0 18px rgba(232,200,119,.32);transform:translateY(-3px)}
.item .cnt{position:absolute;right:2px;bottom:1px;font-size:1.6vmin;color:var(--dim)}
#top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:1.2vmin 1.5vmin;background:linear-gradient(180deg,rgba(4,7,12,.72),rgba(4,7,12,.34) 72%,transparent);
  z-index:20;pointer-events:none}
#roomName{font-size:clamp(11px,1.9vmin,17px);letter-spacing:.12em;color:var(--teal);text-shadow:0 1px 4px #000;opacity:.98;
  padding:.75vmin 1.1vmin;border-left:2px solid var(--teal);border-radius:0 8px 8px 0;background:rgba(7,13,22,.62);
  box-shadow:0 4px 16px rgba(0,0,0,.2)}
#menu{display:flex;gap:.65vmin;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;max-width:78%}
.mb{font-size:clamp(10px,1.7vmin,15px);padding:.9vmin 1.4vmin;min-height:36px;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,rgba(20,29,44,.9),rgba(7,12,21,.9));border:1px solid rgba(210,224,244,.2);
  color:#e6ecf5;box-shadow:0 3px 12px rgba(0,0,0,.18);transition:transform .18s,border-color .18s,color .18s,background .18s}
.mb:hover{border-color:var(--line);color:var(--gold);background:linear-gradient(180deg,rgba(47,54,62,.92),rgba(17,22,30,.94));transform:translateY(-1px)}
.mb.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(232,200,119,.18)}
.mb:focus-visible,.btn:focus-visible,.dbtn:focus-visible,.pkey:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* ---------- screens / overlays ---------- */
.screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 36%,rgba(24,38,61,.78),rgba(4,7,13,.96) 76%),linear-gradient(180deg,rgba(4,7,13,.9),rgba(4,7,13,.97));
  padding:3vmin;text-align:center;backdrop-filter:blur(4px)}
.screen h1{font-size:clamp(22px,5.4vmin,54px);color:var(--gold);letter-spacing:.08em;margin-bottom:1.5vmin;text-shadow:0 0 30px rgba(232,200,119,.3)}
.screen h2{font-size:clamp(16px,3.4vmin,32px);color:var(--gold);margin-bottom:1.6vmin}
.screen p{font-size:clamp(11px,2.1vmin,19px);color:#cfd8e4;line-height:1.7;max-width:78ch;margin-bottom:1.4vmin}
.screen .small{font-size:clamp(9px,1.6vmin,14px);color:var(--dim)}
.btn{margin:.8vmin;padding:1.4vmin 3.2vmin;font-size:clamp(12px,2.2vmin,20px);border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#283a56,#101a2b);color:var(--gold);border:1px solid var(--line);min-height:var(--touch);
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 5px 16px rgba(0,0,0,.24);transition:transform .18s,background .18s,box-shadow .18s}
.btn:hover{background:linear-gradient(180deg,#344b6c,#17253a);box-shadow:0 0 18px rgba(232,200,119,.25);transform:translateY(-1px)}
.btn.ghost{color:#c3ccd8;border-color:rgba(255,255,255,.2)}
#titleArt{width:min(88%,72vh);margin-bottom:2vmin;pointer-events:none}
#endArt{width:min(70%,52vh);margin-bottom:1vmin}
.ov{position:absolute;inset:0;z-index:50;background:rgba(4,6,11,.86);display:flex;align-items:center;justify-content:center;padding:2vmin}
.panel{background:linear-gradient(145deg,rgba(19,27,41,.97),rgba(7,11,19,.98));border:1px solid var(--line);border-radius:16px;
  padding:2.4vmin 2.8vmin;max-width:min(92%,820px);max-height:92%;overflow:auto;position:relative;
  box-shadow:0 22px 70px rgba(0,0,0,.58),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(14px)}
.panel h3{color:var(--gold);font-size:clamp(13px,2.6vmin,24px);margin-bottom:1.4vmin;letter-spacing:.06em}
.xclose{position:absolute;top:1.2vmin;right:1.4vmin;font-size:clamp(14px,2.6vmin,24px);color:#9aa6b6;cursor:pointer;padding:.6vmin}
.xclose:hover{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1vmin}
.jcell{font-size:clamp(10px,1.8vmin,15px);padding:1vmin 1.2vmin;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.04)}
.jcell.on{border-color:var(--line);color:var(--gold)}
.jcell.off{color:#49525f}
.mzTitle{color:var(--teal);font-size:clamp(10px,1.9vmin,16px);margin:1.4vmin 0 .6vmin;letter-spacing:.1em}
/* ---------- locks ---------- */
.dialrow{display:flex;gap:2vmin;justify-content:center;margin:2vmin 0}
.dial{text-align:center}
.dbtn{width:11vmin;min-width:52px;height:7vmin;min-height:40px;font-size:2vmin;border-radius:8px;cursor:pointer;
  background:#182438;color:var(--teal);border:1px solid rgba(127,212,224,.4)}
.dnum{font-size:clamp(22px,6vmin,52px);font-family:monospace;color:var(--gold);margin:.8vmin 0;text-shadow:0 0 14px rgba(232,200,119,.4)}
.jrow{display:flex;align-items:center;gap:1.4vmin;padding:1vmin;border:1px solid rgba(255,255,255,.14);border-radius:8px;margin:.7vmin 0;cursor:pointer}
.jrow:hover{border-color:var(--line)}
.jrow.act{background:rgba(232,200,119,.14);border-color:var(--gold)}
.jnum{width:8vmin;min-width:40px;height:8vmin;min-height:40px;border-radius:50%;border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:2.6vmin;color:var(--gold);background:rgba(232,200,119,.1)}
.keys{display:flex;gap:.8vmin;justify-content:center;margin:2vmin 0}
.pkey{width:9vmin;min-width:44px;height:12vmin;min-height:56px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#f2efe6 0 60%,#cfc7b2 60% 78%,#f2efe6 78%);
  border:1px solid #8d8672;color:#333;font-size:2.2vmin;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.8vmin}
.pkey.on{background:linear-gradient(180deg,#ffe9a8 0 60%,#e3c66f 60% 78%,#ffe9a8 78%);border-color:var(--gold);box-shadow:0 0 16px rgba(232,200,119,.5)}
.pkey.black{background:linear-gradient(180deg,#2a2f3a 0 62%,#1a1e26 62% 80%,#2a2f3a 80%);border-color:#454c59}
.seqline{text-align:center;font-size:clamp(12px,2.4vmin,20px);color:var(--teal);min-height:2.4em;letter-spacing:.35em}
.fuses{display:flex;gap:2vmin;justify-content:center;margin:2vmin 0}
.fuse{width:12vmin;min-width:64px;height:16vmin;min-height:84px;border-radius:10px;border:2px solid #4b5568;background:#0d1420;
  display:flex;align-items:center;justify-content:center;font-size:2vmin;color:#63708a;cursor:pointer}
.fuse.has{border-color:var(--teal);color:var(--teal);background:rgba(127,212,224,.08)}
.fuse.empty{border-style:dashed;border-color:#7c5b2a;color:#a97e3d}
/* rotate hint */
#rotate{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#05070d;text-align:center;padding:6vmin}
#rotate svg{width:min(50vw,200px);margin-bottom:4vmin;animation:rot 2.4s ease-in-out infinite}
#rotate p{font-size:clamp(13px,4vw,20px);color:var(--gold);line-height:1.6}
@keyframes rot{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait){#rotate.show{display:flex}}
/* beam + misc anims */
.beamsw{transform-box:fill-box;transform-origin:0 50%;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.twinkle{animation:tw 3.4s infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.25}}
.waterSh{animation:wsh 6s ease-in-out infinite}
@keyframes wsh{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.beamsw,.twinkle,.waterSh,.hs::after{animation:none}}
</style>
</head>
<body>
<div id="frame"><div id="game">
  <div id="scene"></div>
  <div id="hotspots"></div>
  <div id="top">
    <div id="roomName"></div>
    <div id="menu">
      <button class="mb" id="bMap"></button>
      <button class="mb" id="bJournal"></button>
      <button class="mb" id="bHint"></button>
      <button class="mb" id="bHelp">?</button>
      <button class="mb" id="bSound"></button>
      <button class="mb" id="bLang"></button>
      <button class="mb" id="bSave"></button>
      <button class="mb" id="bTitle"></button>
    </div>
  </div>
  <div id="hud">
    <div id="msg"></div>
    <div id="invRow"><div id="inv"></div></div>
  </div>
  <div class="screen" id="scrTitle"></div>
  <div class="screen" id="scrEnd" style="display:none"></div>
  <div class="ov" id="overlay" style="display:none"><div class="panel" id="ovPanel"></div></div>
</div></div>
<div id="rotate"><svg viewBox="0 0 100 100"><rect x="35" y="12" width="30" height="62" rx="6" fill="none" stroke="#e8c877" stroke-width="3"/><rect x="40" y="18" width="20" height="44" rx="2" fill="#182438"/><circle cx="50" cy="85" r="3" fill="#7fd4e0"/></svg><p id="rotTxt"></p></div>
<script>
"use strict";
/* =================================================================
   AZURE MOONLIGHT RESORT — single-file escape game
   ================================================================= */
const SAVEKEY='azurescape_v1', W=1600, H=900;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function T(o){return (o&&typeof o==='object')?(o[LANG()]):o;}
function LANG(){return G?G.lang:((navigator.language||'en').toLowerCase().indexOf('ja')===0?'jp':'en');}
function fl(f){return !!G.flags[f];}
function sf(f,v=true){G.flags[f]=v;autosave();}
function has(id){return G.inv.includes(id);}
function give(id){if(!G.inv.includes(id)){G.inv.push(id);sfxPickup();autosave();renderInv();}}
function take(id){const i=G.inv.indexOf(id);if(i>=0)G.inv.splice(i,1);sel=null;autosave();renderInv();}
function nav(r){G.room=r;sf('v_'+r);closeOv();sel=null;render();autosave();}
let msgTimer=null;
function say(txt,ms=9000){
  const m=$('#msg');m.innerHTML=T(txt);
  if(msgTimer)clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>{m.innerHTML='';},ms);
}
function mark(id){if(!G.seen.includes(id)){G.seen.push(id);autosave();}}
function isSeen(id){return G.seen.includes(id);}
function setFlagDone(f){sf(f,true);}

/* ---------------- state ---------------- */
let G=null, sel=null;
function fresh(){return{
  room:'lobby',flags:{},inv:[],seen:[],lang:navigator.language&&navigator.language.toLowerCase().startsWith('ja')?'jp':'en',
  sound:true,found:{},endings:[],t0:Date.now(),started:Date.now()
};}

/* ---------------- save / load ---------------- */
function autosave(){try{if(G&&G.started)localStorage.setItem(SAVEKEY,JSON.stringify(G));}catch(e){}}
function getSave(){try{const s=localStorage.getItem(SAVEKEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function wipeSave(){try{localStorage.removeItem(SAVEKEY);}catch(e){}}

/* ---------------- audio ---------------- */
let AC=null,mg=null,ambOn=false;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.gain.value=0;mg.connect(AC.destination);
  }
  if(AC.state==='suspended')AC.resume();
  if(G&&G.sound){
    mg.gain.setTargetAtTime(.6,AC.currentTime,.3);
    startAmb();
  }
  return AC;
}
function noiseBuf(a){
  const b=a.createBuffer(1,a.sampleRate*3,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;
}
function startAmb(){
  if(ambOn||!AC)return;ambOn=true;
  const a=AC,b=a.createBufferSource();b.buffer=noiseBuf(a);b.loop=true;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=430;
  const g=a.createGain();g.gain.value=.09;
  const lfo=a.createOscillator();lfo.frequency.value=.08;
  const lg=a.createGain();lg.gain.value=.05;lfo.connect(lg);lg.connect(g.gain);
  b.connect(lp);lp.connect(g);g.connect(mg);
  const b2=a.createBufferSource();b2.buffer=b.buffer;b2.loop=true;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600;bp.Q.value=.6;
  const g2=a.createGain();g2.gain.value=.028;
  const l2=a.createOscillator();l2.frequency.value=.031;const l2g=a.createGain();l2g.gain.value=.02;
  l2.connect(l2g);l2g.connect(g2.gain);
  b2.connect(bp);bp.connect(g2);g2.connect(mg);
  b.start();b2.start();lfo.start();l2.start();
}
function tone(f0,f1,dur,type,vol,dt=0){
  if(!G||!G.sound)return;const a=ac();
  const o=a.createOscillator(),g=a.createGain();o.type=type;
  const t=a.currentTime+dt;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.05);
}
function nburst(f0,f1,dur,vol,type='bandpass',dt=0){
  if(!G||!G.sound)return;const a=ac();
  const b=a.createBufferSource();b.buffer=noiseBuf(a);
  const bp=a.createBiquadFilter();bp.type=type;
  const t=a.currentTime+dt;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  b.connect(bp);bp.connect(g);g.connect(mg);b.start(t);b.stop(t+dur+.05);
}
function sfxClick(){tone(760,520,.05,'triangle',.14);}
function sfxDeny(){tone(220,140,.18,'sawtooth',.16);tone(160,110,.2,'sawtooth',.12,.08);}
function sfxPickup(){tone(660,664,.09,'triangle',.16);tone(880,884,.1,'triangle',.16,.09);tone(1320,1326,.14,'triangle',.14,.18);}
function sfxSolved(){[523,659,784,1046].forEach((f,i)=>tone(f,f*1.002,.28,'triangle',.16,i*.11));nburst(3000,1200,.5,.05);}
function sfxDoor(){nburst(420,150,.35,.22,'lowpass');tone(130,55,.4,'sine',.2);}
function sfxCreak(){nburst(1500,420,.55,.09,'bandpass');}
function sfxSplash(){nburst(1100,300,.35,.16);}
function sfxThunder(){nburst(220,42,.9,.3,'lowpass');tone(62,30,1.1,'sine',.22);}
function sfxBeam(){tone(90,1150,1.3,'sine',.2);nburst(800,4000,1.2,.07,'highpass');}

/* ---------------- toggle sound ---------------- */
function setSound(on){
  G.sound=on;
  if(on){ac();startAmb();if(mg)mg.gain.setTargetAtTime(.6,AC.currentTime,.3);}
  else if(mg){mg.gain.setTargetAtTime(0,AC.currentTime,.15);}
  $('#bSound').textContent=T(UI.snd)+(on?' ON':' OFF');
  $('#bSound').classList.toggle('on',on);
  autosave();
}

/* ---------------- UI strings ---------------- */
const UI={
  gameTitle:{en:'AZURE MOONLIGHT RESORT',jp:'Azure月光リゾート'},
  tagline:{en:'A point & click escape in an abandoned seaside resort',jp:'廃墟リゾートを舞台にしたポイント＆クリック脱出ゲーム'},
  cont:{en:'CONTINUE',jp:'つづきから'},
  nw:{en:'NEW GAME',jp:'新しい物語'},
  begin:{en:'BEGIN',jp:'はじめる'},
  introT:{en:'MAROONED',jp:'置き去り'},
  intro:{en:"You wake on the dusty floor of a resort lobby. You don't remember boarding the last ferry — and you certainly don't remember staying when it left.\n\nThe Azure Bay Resort closed in 1998, yet tonight every room smells of fresh paint, and a lighthouse blinks uselessly across the bay. The next boat: two days from now… if anyone bothers to look for you.\n\nLight the lighthouse, ready the boat, and get out alive.",

function numLock(title,code,onSolve,triesTxt){
  const cur=[0,0,0];
  openOv('<h3>'+title+'</h3><div class="dialrow">'+[0,1,2].map(i=>
    '<div class="dial"><button class="dbtn" data-u="'+i+'">▲</button><div class="dnum" id="dn'+i+'">0</div><button class="dbtn" data-d="'+i+'">▼</button></div>').join('')+'</div>'+
    '<div style="text-align:center"><button class="btn" id="dotry">'+T(UI.ok)+'</button></div>');
  const upd=()=>{for(let i=0;i<3;i++)$('#dn'+i).textContent=cur[i];};
  const add=(i,d)=>{cur[i]=(cur[i]+d+10)%10;upd();sfxClick();};
  $$('#ovPanel .dbtn').forEach(b=>b.onclick=()=>add(+ (b.dataset.u!==undefined?b.dataset.u:b.dataset.d), b.dataset.u!==undefined?1:-1));
  $('#dotry').onclick=()=>{
    if(cur.join('')===code){sfxSolved();closeOv();onSolve();}
    else{sfxDeny();say(triesTxt||T(UI.wrong));}
  };
  upd();
}

   '<div style="margin-top:1.6vmin;text-align:center"><span id="jmsg" class="small"></span><button class="btn ghost" id="jrst">'+T(UI.reset)+'</button></div>');
  const paint=()=>{bands.forEach((b,i)=>{const el=$('#jn'+i);el.textContent=order.indexOf(i)>=0?(order.indexOf(i)+1):(i+1);

/* ---------------- render engine ---------------- */
function render(){
  const r=ROOMS[G.room];
  $('#scene').innerHTML=art(G.room);
  renderHots(r);
  $('#roomName').textContent=T(r.n);
  renderInv();
}
function art(id){return ROOMS[id].a();}
function renderHots(r){
  const box=$('#hotspots');box.innerHTML='';
  (r.h||[]).forEach((h,i)=>{
    if(h.cond&&!h.cond())return;
    const k=G.room+':'+i;
    if(h.done&&fl(h.done)&&!h.rep)return;
    hsEl(h,k,i);
  });
  (r.nav||[]).forEach(n=>{
    if(n.cond&&!n.cond())return;
    hsEl({nav:n.to,x:n.x,y:n.y,a:n.a}, 'nav:'+n.to);
  });
}
function hsEl(h,k,i){
  const d=document.createElement('div');
  d.className='hs'+((h.done&&fl(h.done))?' found':'')+(h.nav?' nav':'')+(hlOn?' hl':'');
  d.style.left=h.x+'%';d.style.top=h.y+'%';d.style.width=(h.w||4.5)+'%';d.style.height=(h.h||5)+'%';
  if(h.nav){d.dataset.a=h.a||'➜';}
  d.title=h.t?T(h.t):'';
  d.onclick=e=>{e.stopPropagation();clickH(h,k,i);};
  $('#hotspots').appendChild(d);
}
function denyUse(){say(T({en:'That doesn’t fit here.',jp:'それはここでは使えない。'}));sfxDeny();}
function clickH(h,k,i){
  ac();
  if(h.item){
    if(sel===h.item){actH(h,k);sel=null;renderInv();return;}
    if(h.auto&&has(h.item)){actH(h,k);return;}
    if(sel!==null){denyUse();sel=null;renderInv();return;}
    say(T({en:'Something here needs a tool or a key…',jp:'ここには何かの道具・鍵が必要そうだ…'}));sfxClick();return;
  }
  if(sel!==null){denyUse();sel=null;renderInv();return;}
  if(h.cond&&!h.cond())return;
  if(h.done&&fl(h.done)&&!h.rep){if(h.dt)say(T(h.dt));return;}
  return actH(h,k);
}
function actH(h,k){
  mark(k);
  if(h.act){const r=h.act(k);if(r===false){sfxDeny();return false;}if(r!==undefined)return true;}
  else if(h.say)say(T(h.say));
  else if(h.nav)nav(h.nav);
  else say(T(h.desc||UI.nothing));
  if(h.done)sf(h.done,true);
  renderHots(ROOMS[G.room]);
  return true;
}
function renderInv(){
  const box=$('#inv');box.innerHTML='';
  G.inv.forEach(id=>{
    const it=ITEMS[id];const d=document.createElement('div');
    d.className='item'+(sel===id?' sel':'');
    d.innerHTML='<span>'+it.g+'</span>';
    d.title=nameOf(id)+'\n'+T(it.d);
    d.onclick=()=>{ac();sfxClick();
      if(sel===id){sel=null;}
      else{sel=id;say('<i>'+nameOf(id)+'</i><br><span style="opacity:.8">'+T(it.d)+'</span>',6500);}
      renderInv();};
    box.appendChild(d);
  });
}

   if(fl('beam')){say(T({en:'The switch is on. It will stay on until the sea lets go.',jp:'スイッチはon。海が諦めるまでonのままだろう。'}));return;}
